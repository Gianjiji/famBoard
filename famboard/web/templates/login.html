<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1016">
  <title>Accesso · famboard</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
  <div class="loginwrap">
    <div class="card loginbox">
      <svg class="logomark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M14 30 32 15 50 30v18a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3Z" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round"/>
        <path d="M20 38h6l4-8 6 14 4-6h4" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>famboard</h1>
      <p class="muted">Monitoraggio familiare</p>
      {% if error == 'throttled' %}<p class="loginerr">Troppi tentativi. Riprova tra qualche minuto.</p>
      {% elif error %}<p class="loginerr">Password errata.</p>{% endif %}
      <form method="post" action="/login">
        <input type="password" name="password" placeholder="Password" autofocus required>
        <button type="submit">Entra</button>
      </form>
    </div>
  </div>
</body>
</html>
